name: DevPulse CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Automated Verification (JSON & JS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CI Validation Test Suite
        run: |
          if [ -f "GItHub/scripts/validate.js" ]; then
            node GItHub/scripts/validate.js
          elif [ -f "scripts/validate.js" ]; then
            node scripts/validate.js
          fi
